<!DOCTYPE html>
<html>

<head>
  <title>FREAKY snek</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="microgame.css">
  <!-- <link rel="stylesheet" href="style.css"> -->
  <script src="press.js"></script>
</head>

<body>
  <div id="container"></div>
  <div id="controls">
    <div id="dpad">
      <button id="up">↑</button>
      <button id="left">←</button>
      <button id="right">→</button>
      <button id="down">↓</button>
    </div>
    <button id="jump">jump!</button>
    <button id="meow">meow</button>
  </div>
  <div id="dialog">
    <div id="dialogtext"></div>
    <div id="dialogoptions"></div>
  </div>

  <div id="gameover" style="visibility: hidden;">
    <h1>GAME OVER</h1>
    <div id="deathreason"></div>
  </div>

  <script src="microgame.js"></script>

  <script src="main.js"></script>
</body>

</html>
